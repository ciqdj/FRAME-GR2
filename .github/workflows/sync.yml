name: Auto Sync Fork

on:
  schedule:
    - cron: '0 */6 * * *'  # 北京时间每 6个小时 运行
  workflow_dispatch:      # 允许手动点击按钮触发

jobs:
  sync:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write # 必须赋予写入权限

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull upstream changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # 添加上游仓库源（请确保这里的上游地址正确，根据你的主页显示，上游是 Lyle-xub/FRAME-GR2）
          git remote add upstream https://github.com/Lyle-xub/FRAME-GR2.git
          git fetch upstream
          
          # 切换并合并上游的 main 分支到你仓库的 main 分支
          git checkout main
          git merge upstream/main --allow-unrelated-histories || echo "Merge conflict or already up to date"
          
          # 推送到你的仓库
          git push origin main
