name: Auto Sync Fork

on:
  schedule:
    # 每 6 小时自动运行一次（按 UTC 时间计算）
    - cron: '0 */6 * * *'
  # 允许手动触发执行
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4

      - name: Sync Upstream
        uses: repo-sync/github-sync@v2
        with:
          source_repo: "ahonn/GRKit"     # 原仓库相对路径
          source_branch: "main"          # 原仓库主分支
          destination_branch: "main"     # 你的 Fork 仓库主分支
          github_token: ${{ secrets.GITHUB_TOKEN }}
